name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Run tests
        shell: bash
        run: |
          nvim --clean --headless --cmd "set runtimepath+=$PWD" \
            -c "lua dofile('$PWD/tests/run.lua')" -c "qa!"
